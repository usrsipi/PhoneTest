name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect project type and Gradle version
        id: detect
        shell: bash
        run: |
          echo "=== Files in repository ==="
          find . -maxdepth 3 -not -path '*/.*' | sort

          WRAPPER=$(find . -maxdepth 3 -name "gradlew" -not -path './.*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
            echo "Found gradlew in: $DIR"
            echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
            echo "gradle_version=wrapper" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SETTINGS=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path './.*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find . -maxdepth 3 \( -name "build.gradle.kts" -o -name "build.gradle" \) -not -path './.*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          fi

          if [ -n "$SETTINGS" ]; then
            DIR=$(dirname "$SETTINGS")
            echo "Found Android project without gradlew in: $DIR"
            echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"

            GVER=""
            if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
              GVER=$(sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -n 1)
            fi
            if [ -z "$GVER" ]; then
              if grep -rnE '(agp|com\.android\.application).*8\.[0-9]+' "$DIR" --include="*.toml" --include="*.kts" --include="*.gradle" >/dev/null 2>&1; then
                GVER="8.14"
              else
                GVER="current"
              fi
            fi
            echo "Using Gradle version: $GVER"
            echo "gradle_version=$GVER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if find . -maxdepth 2 -name "package.json" | grep -q .; then
            echo "::error::This repo contains package.json (a Web app), NOT a native Android app! Switch Google AI Studio Build to Android mode or deploy it as a website."
            exit 1
          fi

          echo "::error::No gradlew, build.gradle(.kts), or package.json found in this repo."
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.detect.outputs.gradle_version }}

      - name: Create debug.keystore if missing
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            python3 - << 'EOF'
          import pathlib, re, subprocess

          gradle_file = pathlib.Path("app/build.gradle.kts")
          if not gradle_file.exists():
              gradle_file = pathlib.Path("app/build.gradle")

          store_pass = "android"
          key_pass = "android"
          key_alias = "androiddebugkey"

          def extract_val(line, default):
              m = re.search(r'\?:\s*["\']([^"\']+)["\']', line)
              if m:
                  return m.group(1)
              if "getenv" not in line and "Property" not in line:
                  m = re.search(r'["\']([^"\']+)["\']', line)
                  if m:
                      return m.group(1)
              return default

          if gradle_file.exists():
              text = gradle_file.read_text(encoding="utf-8", errors="ignore")
              idx = text.find("debugConfig")
              if idx == -1:
                  idx = text.find("signingConfigs")
              if idx != -1:
                  snippet = "\n".join(text[idx:].splitlines()[:20])
                  print("=== signingConfigs snippet ===")
                  print(snippet)
                  for line in snippet.splitlines():
                      if "storePassword" in line:
                          store_pass = extract_val(line, store_pass)
                      elif "keyPassword" in line:
                          key_pass = extract_val(line, key_pass)
                      elif "keyAlias" in line:
                          key_alias = extract_val(line, key_alias)

          print(f"Generating debug.keystore with alias={key_alias}")
          subprocess.run([
              "keytool", "-genkeypair", "-noprompt",
              "-keystore", "debug.keystore",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", key_alias,
              "-storepass", store_pass,
              "-keypass", key_pass,
              "-dname", "CN=Android Debug,O=Android,C=US"
          ], check=True)
          EOF
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.use_wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
